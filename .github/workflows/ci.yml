name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + dev deps (CPU torch, quantum)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib joblib scikit-learn pytest psutil
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install qutip cqlib==1.3.11

      - name: Install package (editable)
        run: pip install -e .

      - name: Frozen-core integrity check (L0)
        run: aemtn verify

      - name: Run test suite (deselect 3 private-artifact tests)
        run: |
          python -m pytest -q \
            --deselect tests/test_cadence_pair_loop.py::test_fake_backend_true_scheduler_path_runs_end_to_end_and_seals_log \
            --deselect tests/test_cadence_pair_loop.py::test_output_is_non_overwriting_and_hardware_mode_is_not_exposed \
            --deselect tests/test_run_b4_map_root_cause_ab.py::test_legacy_control_is_five_endpoint_all_pass

      - name: Confirm hybrid final reproducible
        run: aemtn reproduce-final
